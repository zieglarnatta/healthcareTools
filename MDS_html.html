<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; upgrade-insecure-requests;">
<title>MDS Note Generator</title>
<link rel="stylesheet" href="static/css/styles.css">
</head>

<div class="container">

<div class="title-row">
    <h1>MDS</h1>
    <select id="noteType">
        <option></option>
        <option>Admission</option>
        <option>Quarterly</option>
        <option>Annual</option>
        <option>Significant Changes</option>
    </select>
    <div class="note-generator">Note Generator</div>
</div>

<div class="card">

<div class="grid">

<div>
<label>Resident Name</label>
<input type="text" id="residentName" maxlength="30" autocomplete="off" spellcheck="false">
</div>

<div>
<label>Age</label>
<input type="number" id="age" min="18" max="110" step="1" autocomplete="off" spellcheck="false">
</div>

<div>
<label>ARD</label>
<input type="date" id="ard" autocomplete="off" spellcheck="false">
</div>

<div>
<label>DPOA</label>
<input type="text" id="dpoa" maxlength="30" autocomplete="off" spellcheck="false">
</div>

<div>
<label>Orientation</label>
<select id="orientation">
<option value=""></option>
<option>Resident is alert and oriented x4.</option>
<option>Resident is alert and oriented x3.</option>
<option>Resident is alert and oriented x2.</option>
<option>Resident is alert and oriented x1.</option>
<option>Resident declined to participate in BIMS assessment.</option>
</select>
</div>

<div class="full-row">
<label>BIMS</label>
<select id="bims">
    <option value=""></option>
    <option>with a score of 1/15. SW proceeded to staff interviews and review of the chart.</option>
    <option>with a score of 2/15. SW proceeded to staff interviews and review of the chart.</option>
    <option>with a score of 3/15. SW proceeded to staff interviews and review of the chart.</option>
    <option>with a score of 4/15. SW proceeded to staff interviews and review of the chart.</option>
    <option>with a score of 5/15. SW proceeded to staff interviews and review of the chart.</option>
    <option>with a score of 6/15. SW proceeded to staff interviews and review of the chart.</option>
    <option>with a score of 7/15. SW proceeded to PHQ-2 to 9 assessment.</option>
    <option>with a score of 8/15. SW proceeded to PHQ-2 to 9 assessment.</option>
    <option>with a score of 9/15. SW proceeded to PHQ-2 to 9 assessment.</option>
    <option>with a score of 10/15. SW proceeded to PHQ-2 to 9 assessment.</option>
    <option>with a score of 11/15. SW proceeded to PHQ-2 to 9 assessment.</option>
    <option>with a score of 12/15. SW proceeded to PHQ-2 to 9 assessment.</option>
    <option>with a score of 13/15. SW proceeded to PHQ-2 to 9 assessment.</option>
    <option>with a score of 14/15. SW proceeded to PHQ-2 to 9 assessment.</option>
    <option>with a score of 15/15. SW proceeded to PHQ-2 to 9 assessment.</option>
    <option>resident declined to participate in assessment. SW proceeded to staff interviews.</option>
</select>
</div>

<div>
<label>PHQ Result</label>
<select id="phq">
<option value=""></option>
<option>9/27, indicating mild depression.</option>
<option>10/27, indicating moderate depression.</option>
<option>11/27, indicating moderate depression.</option>
<option>12/27, indicating moderate depression.</option>
<option>13/27, indicating moderate depression.</option>
<option>14/27, indicating moderate depression.</option>
<option>15/27, indicating moderately severe depression.</option>
<option>16/27, indicating moderately severe depression.</option>
<option>17/27, indicating moderately severe depression.</option>
<option>18/27, indicating moderately severe depression.</option>
<option>19/27, indicating moderately severe depression.</option>
<option>20/27, indicating severe depression.</option>
<option>21/27, indicating severe depression.</option>
<option>22/27, indicating severe depression.</option>
<option>23/27, indicating severe depression.</option>
<option>24/27, indicating severe depression.</option>
<option>25/27, indicating severe depression.</option>
<option>26/27, indicating severe depression.</option>
<option>27/27, indicating severe depression.</option>
</select>
</div>

<div>
<label>Behavior</label>
<select id="behavior">
<option value=""></option>
<option>Resident's behavior is stable. No physical, verbal or other behaviors noted or reported.</option>
<option>Resident's behavior is not stable.</option>
<option>Resident's behavior is stable.</option>
<option>Occasional verbal agitation noted.</option>
<option>Requires staff redirection at times.</option>
<option>No significant behavior concerns.</option>
</select>
</div>

<div>
<label>Care Conference</label>
<select id="careConference">
<option value=""></option>
<option>offered and accepted.</option>
<option>offered and declined.</option>
<option>held with family present.</option>
<option>not conducted this quarter.</option>
</select>
</div>

<div>
<label>POLST</label>
<select id="polst">
<option value=""></option>
<option>FULL CODE / FULL TREATMENT</option>
<option>FULL CODE / SELECTIVE TREATMENT</option>
<option>DNR / FULL TREATMENT</option>
<option>DNR / SELECTIVE TREATMENT</option>
<option>DNR / COMFORT-FOCUSED TREATMENT</option>
</select>
</div>

</div>

<div class="buttons">
<button type="button" id="generateBtn">Generate Note</button>
<button id="copyBtn">Copy Note</button>
<button id="printBtn">Print</button>
<button id="clearBtn">Clear</button>
</div>

</div>

<div class="card">
<h2>Generated Note</h2>
<textarea id="output"></textarea>
</div>

<!-- Toast container for non-blocking messages -->
<div id="toastContainer" aria-live="polite"></div>

</div>

<script src="static/js/mds.js" defer></script>

</body>
</html>
